services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncally
      POSTGRES_USER: syncally
      POSTGRES_PASSWORD: syncally-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncally -d syncally"]
      interval: 2s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/var/lib/temporal

volumes:
  postgres_data:
  temporal_data:
