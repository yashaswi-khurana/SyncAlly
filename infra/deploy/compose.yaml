name: syncally

x-app-environment: &app-environment
  APP_ENV: production
  DEBUG: "false"
  PUBLIC_FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in infra/deploy/.env}
  DATABASE_URL: postgresql+psycopg://syncally:${SYNCALLY_DB_PASSWORD:?Set SYNCALLY_DB_PASSWORD in infra/deploy/.env}@db:5432/syncally
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/deploy/.env}
  JWT_ALGORITHM: HS256
  TEMPORAL_ADDRESS: ${TEMPORAL_DOMAIN:?Set TEMPORAL_DOMAIN in infra/deploy/.env}:443
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: syncally-deals
  TEMPORAL_TLS: "true"
  TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-offline}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  PAYMENT_MODE: PAYPAL_SANDBOX
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in infra/deploy/.env}
      SYNCALLY_DB_PASSWORD: ${SYNCALLY_DB_PASSWORD:?Set SYNCALLY_DB_PASSWORD in infra/deploy/.env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in infra/deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-syncally.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.2}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in infra/deploy/.env}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in infra/deploy/.env}
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-temporal-postgres.sh"]
    volumes:
      - ./setup-temporal-postgres.sh:/scripts/setup-temporal-postgres.sh:ro

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.2}
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_SEEDS: db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in infra/deploy/.env}
      VISIBILITY_POSTGRES_SEEDS: db
      VISIBILITY_POSTGRES_USER: temporal
      VISIBILITY_POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in infra/deploy/.env}
      BIND_ON_IP: 0.0.0.0
      SKIP_SCHEMA_SETUP: "true"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    # Port 7233 stays private; Caddy terminates public TLS on TEMPORAL_DOMAIN.

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.2}
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      DEFAULT_NAMESPACE: default
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-temporal-namespace.sh"]
    volumes:
      - ./create-temporal-namespace.sh:/scripts/create-temporal-namespace.sh:ro

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  workflow-worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    environment: *app-environment
    command: ["python", "-m", "syncally.workflows.worker"]

  outbox-worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    environment: *app-environment
    command: ["python", "-m", "syncally.cli.outbox_worker"]

  payment-worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    command: ["python", "-m", "syncally.cli.payment_worker"]

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in infra/deploy/.env}
      TEMPORAL_DOMAIN: ${TEMPORAL_DOMAIN:?Set TEMPORAL_DOMAIN in infra/deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    networks:
      default:
        aliases:
          - ${TEMPORAL_DOMAIN:?Set TEMPORAL_DOMAIN in infra/deploy/.env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
