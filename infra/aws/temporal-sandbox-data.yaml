AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal sandbox networking and PostgreSQL resources for SyncAlly ECS workers.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the worker and database security groups.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different Availability Zones for the RDS subnet group.

Resources:
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SyncAlly sandbox worker egress; no inbound access.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Worker egress to PostgreSQL, Temporal Cloud, ECR, Secrets Manager, and CloudWatch.

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access only from SyncAlly worker tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WorkerSecurityGroup
          Description: PostgreSQL from SyncAlly ECS tasks only.

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: SyncAlly sandbox PostgreSQL subnets.
      SubnetIds: !Ref SubnetIds

  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/database-password'
      Description: Generated PostgreSQL master password for the SyncAlly sandbox database.
      GenerateSecretString:
        PasswordLength: 36
        ExcludePunctuation: true
        RequireEachIncludedType: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-db'
      Engine: postgres
      DBName: syncally
      MasterUsername: syncally
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      PubliclyAccessible: false
      DeletionProtection: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: Database
    Properties:
      Name: !Sub '${AWS::StackName}/database-url'
      Description: SQLAlchemy PostgreSQL URL for SyncAlly ECS tasks.
      SecretString: !Sub 'postgresql+psycopg://syncally:{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/syncally?sslmode=require'

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/jwt-secret'
      Description: Generated JWT signing secret for SyncAlly ECS tasks.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        RequireEachIncludedType: true

Outputs:
  WorkerSecurityGroupId:
    Value: !Ref WorkerSecurityGroup
  DatabaseSecurityGroupId:
    Value: !GetAtt DatabaseSecurityGroup.GroupId
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
  JwtSecretArn:
    Value: !Ref JwtSecret
  DatabasePasswordSecretArn:
    Value: !Ref DatabasePasswordSecret
