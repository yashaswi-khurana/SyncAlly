name: Branch naming

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name omits codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Reject codex in the PR branch name
        run: python scripts/check_pr_branch_name.py
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
